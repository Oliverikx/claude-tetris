<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
  <h1 class="game-title">TETRIS</h1>
  <button id="theme-btn" type="button">Light mode</button>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">ENERGY</span>
          <div class="energy-bar"><div id="energy-fill"></div></div>
          <span id="ability-status"></span>
        </div>

        <div class="panel-section hidden" id="hold-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>C</kbd> usar hold</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div class="panel-section hidden" id="queue-section">
        <span class="label">PREVIEW</span>
        <canvas id="queue-canvas" width="60" height="300"></canvas>
      </div>
    </div>

    <div id="ability-menu" class="overlay hidden">
      <div class="overlay-box">
        <p class="menu-title">HABILIDAD</p>
        <button class="ability-btn" data-ability="1"><kbd>1</kbd> Ver 5 piezas</button>
        <button class="ability-btn" data-ability="2"><kbd>2</kbd> Cambiar pieza</button>
        <button class="ability-btn" data-ability="3"><kbd>3</kbd> Ralentizar 10s</button>
        <button class="ability-btn" data-ability="4"><kbd>4</kbd> Deshacer</button>
        <button class="ability-btn" data-ability="5"><kbd>5</kbd> Guardar pieza</button>
        <button id="ability-cancel" class="ability-btn cancel">Esc cancelar</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
